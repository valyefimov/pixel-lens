<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 1280px; height: 720px; display: grid; place-items: center; background: #08080a; color: #fff;
        font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif; overflow: hidden; position: relative; }
      .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 32px 32px;
        mask-image: radial-gradient(60% 60% at 50% 50%, #000, transparent); }
      .glow { position: absolute; inset: 0; background: radial-gradient(45% 50% at 50% 40%, rgba(124,92,255,.35), transparent 70%); }
      main { position: relative; text-align: center; }
      h1 { font-size: 64px; letter-spacing: -0.035em; margin: 28px 0 12px; font-weight: 700; }
      p { font-size: 26px; color: #a1a1ad; margin: 0; }
      .url { margin-top: 36px; display: inline-block; font: 600 26px ui-monospace, Menlo, monospace; color: #c4b7ff;
        padding: 14px 26px; border: 1px solid rgba(124,92,255,.5); border-radius: 14px; background: rgba(124,92,255,.08); }
    </style>
  </head>
  <body>
    <div class="grid"></div><div class="glow"></div>
    <main>
      <svg width="96" height="96" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9478FF"/><stop offset="1" stop-color="#5534F0"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#g)"/><circle cx="14.2" cy="14.2" r="6.6" fill="none" stroke="#fff" stroke-width="2.4"/><path d="M19.2 19.2l5.3 5.3" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><rect x="11.8" y="11.8" width="4.8" height="4.8" rx=".8" fill="#fff"/></svg>
      <h1>Pixel Lens</h1>
      <p>Free and open source. Works in any Chromium browser.</p>
      <div class="url">pixel-lens.yefimov.tech</div>
    </main>
  </body>
</html>
